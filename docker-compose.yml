services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pdf_chat_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdf_chat_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mcp-server:
    build: ./mcp-server
    container_name: mcp_server
    ports:
      - "8001:8001"

volumes:
  pgdata: